name: Sync upstream skills

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Move each source to its upstream tip and regenerate the copies
        run: node scripts/sync.ts --update
      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: automation/sync-skills
          commit-message: 'chore: sync upstream skills'
          delete-branch: true
          title: 'chore: sync upstream skills'
          body: |
            Moves the pinned `sources/` submodules to their upstream tips and regenerates the skill copies.

            Review the changed skill instructions before merging: agents run them with full permissions. This workflow never auto-merges.
          add-paths: |
            skills
            sources
